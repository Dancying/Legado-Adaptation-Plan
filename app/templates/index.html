<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Legado-Adaptation-Plan</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-color: #2c3e50;
            --accent-purple: #6a11cb;
            --link-gray: #4a5568;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #4b6cb7 40%, #916dd5 100%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        .project-title {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: -0.5px;
            text-align: center;
            padding: 0 1rem;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 2rem 1.2rem;
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            width: 88%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        .qr-section {
            background: #ffffff;
            padding: 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid #f0f0f0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .qr-section:active {
            transform: scale(0.95);
        }

        .qr-section img {
            display: block;
            width: 200px;
            height: 200px;
            max-width: 100%;
        }

        .qr-tip {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 10px;
            font-weight: 500;
        }

        .link-container {
            background: #f7fafc;
            border: 2px dashed #4b6cb7;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .link-container:active {
            background: #edf2f7;
        }

        .url-display {
            display: block;
            color: #2d3748;
            word-break: break-all;
            font-size: 0.8rem;
            font-family: 'SFMono-Regular', Consolas, monospace;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .copy-hint {
            font-size: 0.75rem;
            color: #4b6cb7;
            font-weight: 600;
        }

        .footer-links {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #edf2f7;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
        }

        .footer-links a {
            color: var(--link-gray);
            text-decoration: none;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .icon { width: 14px; height: 14px; fill: currentColor; }

        #toast {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(45, 55, 72, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        @media (max-width: 350px) {
            .footer-links {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="project-title">Legado-Adaptation-Plan</div>

    <div class="main-card">
        <div class="qr-section" onclick="copyToClipboard()">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data={{ source_url|urlencode }}" alt="QR Code">
            <div class="qr-tip">点击二维码复制链接</div>
        </div>

        <div class="link-container" onclick="copyToClipboard()">
            <span class="url-display" id="sourceUrl">{{ source_url }}</span>
            <span class="copy-hint">点击复制导入地址</span>
        </div>

        <div class="footer-links">
            <a href="https://github.com/Dancying/Legado-Adaptation-Plan" target="_blank">
                <svg class="icon" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
                GitHub 项目主页
            </a>
            <a href="https://github.com/gedoor/legado/releases" target="_blank">
                <svg class="icon" viewBox="0 0 24 24"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z" /></svg>
                开源阅读 APP
            </a>
        </div>
    </div>

    <div id="toast">链接已复制到剪贴板</div>

    <script>
    async function copyToClipboard() {
        const text = document.getElementById('sourceUrl').innerText;
        try {
            await navigator.clipboard.writeText(text);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        } catch (err) {
            const tempArea = document.createElement('textarea');
            tempArea.value = text;
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);
        }
    }
    </script>
</body>
</html>
